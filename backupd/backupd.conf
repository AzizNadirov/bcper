# backupd.conf — configuration for backupd.sh
# All paths are expanded, so ~ and $HOME work fine.
# After editing, test with:  ./backupd.sh --dry-run

# ── Identity ──────────────────────────────────────────────────────────────────
# A short label used in logs and lock files (no spaces)
LABEL="home-backup"

# ── Remote destination ────────────────────────────────────────────────────────
# Format:  <rclone-remote-name>:<bucket-or-folder>
#
# Google Drive:        gdrive:Backups
# S3-compatible:       s3:my-bucket/backups
# OneDrive:            onedrive:Backups
# SFTP:                myserver:~/backups
#
# Run "rclone config" once to set up the remote, then put its name here.
REMOTE="gdrive:Backups"

# ── Directories to back up ────────────────────────────────────────────────────
# Bash array — add as many paths as you like.
BACKUP_DIRS=(
  "$HOME/Documents"
  "$HOME/Projects"
  # "$HOME/.config"
  # "/etc"
)

# ── Retention ─────────────────────────────────────────────────────────────────
# How many timestamped snapshots to keep per directory.
# Oldest are deleted automatically after each successful run.
KEEP_VERSIONS=5

# ── Schedule ──────────────────────────────────────────────────────────────────
# Used when the script is called by cron/systemd at a high frequency
# (e.g. every minute) but you only want it to actually run periodically.
# Values: hourly | daily | weekly | <seconds>
# Leave empty ("") to always run when invoked.
SCHEDULE="daily"

# ── Compression ───────────────────────────────────────────────────────────────
# true  → pack each dir into a .tar.gz before uploading (slower, smaller)
# false → upload files directly with rclone copy (faster, browsable on Drive)
COMPRESS=false

# ── Exclude patterns (rclone glob syntax) ────────────────────────────────────
# Space-separated list of patterns to skip.
# Examples: "*.log" ".git/**" "__pycache__/**" "*.pyc" "node_modules/**"
EXCLUDE_PATTERNS="*.log .git/** __pycache__/** *.pyc node_modules/** .DS_Store"

# ── rclone tuning flags ───────────────────────────────────────────────────────
# Override defaults if needed. Leave empty to use built-in defaults.
# RCLONE_FLAGS="--transfers 4 --checkers 8 --retries 3"

# ── Log file ──────────────────────────────────────────────────────────────────
LOG_FILE="$HOME/.local/share/backupd/backupd.log"

# ── Timestamp format ──────────────────────────────────────────────────────────
# Used to name each snapshot folder in the remote.
# Default: 2024-11-05T14-30-00  (ISO 8601, colons replaced for cloud compat)
STAMP_FORMAT="%Y-%m-%dT%H-%M-%S"
